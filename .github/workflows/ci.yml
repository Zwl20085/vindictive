name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs; the comment names the tag the SHA
# was resolved from. Dependabot (.github/dependabot.yml) keeps them current.

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  cargo-audit:
    name: cargo audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      # Caches ~/.cargo/bin, so cargo-audit is only compiled when the cache
      # is cold; on a warm cache `cargo install` sees it and exits at once.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: cargo-audit
          cache-targets: false

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Ignored advisories, each with its reason. Revisit when upstream moves.
      # RUSTSEC-2026-0367/0368/0369/0429: zip 4.x extraction bugs. zip comes in
      #   only through tauri-plugin-updater, which on Windows installs the
      #   signed .exe/.msi directly (createUpdaterArtifacts: true, not v1
      #   zips), and any archive is signature-checked before it is opened.
      #   Fixed in zip 9; needs a tauri-plugin-updater release that uses it.
      - name: cargo audit
        shell: bash
        run: >
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0367
          --ignore RUSTSEC-2026-0368
          --ignore RUSTSEC-2026-0369
          --ignore RUSTSEC-2026-0429

  bundle:
    name: Debug bundle (Windows)
    runs-on: windows-latest
    # Slow (full Tauri build plus NSIS and WiX), so it runs in parallel with
    # the test job instead of after it. It exists to catch tauri.conf.json and
    # installer breakage on the pull request rather than at release time.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: bundle

      - name: Install npm dependencies
        run: npm ci

      # Pull requests have no signing key, so the updater artifacts (which
      # must be signed) are switched off for this build only.
      - name: Build debug installers
        shell: bash
        run: |
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > "$RUNNER_TEMP/ci.conf.json"
          npm run tauri -- build --debug --ci --config "$RUNNER_TEMP/ci.conf.json"

      - name: Check installers exist
        shell: bash
        run: |
          ls src-tauri/target/debug/bundle/nsis/*-setup.exe
          ls src-tauri/target/debug/bundle/msi/*.msi
