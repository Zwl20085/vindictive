<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
  <title>Anatomy of a Vindictive tile</title>
  <rect width="800" height="400" fill="#111214"/>

  <!-- the tile: wide 4x2 scaled 1.4x → 384 x 188 at (208, 106) -->
  <g transform="translate(208 106)">
    <rect x="0" y="0" width="384" height="188" fill="#EE1111"/>
    <rect x="0" y="0" width="3" height="188" fill="#FFFFFF"/>
    <text x="17" y="28" fill="#FFFFFF" font-size="15" font-weight="600" letter-spacing="1.4">NEXT</text>
    <text x="73" y="28" fill="#FFFFFF" font-size="15" font-weight="400" opacity="0.9">3d 6h</text>
    <text x="367" y="29" fill="#FFFFFF" font-size="17" text-anchor="end" opacity="0.9">▲</text>
    <text x="17" y="142" fill="#FFFFFF" font-size="34" font-weight="300">IEMDC abstract</text>
    <text x="17" y="172" fill="#FFFFFF" font-size="18" font-weight="300" opacity="0.85">Submit before 23:59 · Lab 302</text>
  </g>

  <!-- annotations -->
  <g stroke="#8A8D95" stroke-width="1" fill="none">
    <!-- next edge -->
    <line x1="209" y1="200" x2="120" y2="200"/>
    <!-- NEXT label -->
    <line x1="240" y1="124" x2="240" y2="70"/>
    <!-- countdown -->
    <line x1="305" y1="124" x2="305" y2="50"/>
    <!-- kind glyph -->
    <line x1="568" y1="124" x2="568" y2="70"/>
    <!-- title -->
    <line x1="420" y1="256" x2="420" y2="330"/>
    <!-- subtitle -->
    <line x1="560" y1="288" x2="560" y2="350"/>
    <!-- colour -->
    <line x1="592" y1="160" x2="680" y2="160"/>
  </g>
  <g fill="#C9CBD1" font-size="13" font-weight="400">
    <text x="112" y="204" text-anchor="end">2 px white edge = next up</text>
    <text x="240" y="62" text-anchor="middle">NEXT label</text>
    <text x="305" y="42" text-anchor="middle">countdown: 3w · 5d · 2d 4h · 6h · 45m</text>
    <text x="568" y="62" text-anchor="middle">kind glyph</text>
    <text x="420" y="346" text-anchor="middle">title, weight 300, up to 3 lines</text>
    <text x="560" y="366" text-anchor="middle">first body line or location</text>
    <text x="688" y="156">colour = kind or urgency</text>
    <text x="688" y="174" fill="#8A8D95">red: due within 48 h</text>
  </g>

  <!-- size legend -->
  <g transform="translate(40 300)">
    <rect x="0" y="0" width="32" height="32" fill="#2D89EF"/>
    <text x="0" y="52" fill="#8A8D95" font-size="11">sm 1×1</text>
    <rect x="52" y="-16" width="48" height="48" fill="#00ABA9"/>
    <text x="52" y="52" fill="#8A8D95" font-size="11">md 2×2</text>
  </g>
  <g transform="translate(660 300)">
    <rect x="0" y="0" width="96" height="48" fill="#1E7145"/>
    <text x="0" y="68" fill="#8A8D95" font-size="11">wide 4×2</text>
  </g>
</svg>
